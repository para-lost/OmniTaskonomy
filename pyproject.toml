[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitaskonomy"
version = "0.1.0"
description = "UMM training, evaluation, and gradient analysis for OmniTaskonomy"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.24,<2",
    "Pillow>=10,<12",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
analysis = ["pandas==2.3.3", "openpyxl==3.1.5"]

[tool.setuptools.packages.find]
include = ["omnitaskonomy*"]
